<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3436">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GS Serviços">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gustavo Soares — Controle de Serviços</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#14213d; --muted:#6b7280; --line:#e5e7eb;
  --brand:#13666a; --brand-2:#4f9a98; --brand-soft:#e3f0ef;
  --navy:#0f3436; --warn:#b45309; --warn-soft:#fef3c7; --danger:#b91c1c; --danger-soft:#fee2e2;
  --ok:#15803d; --ok-soft:#dcfce7; --blue:#1d4ed8; --blue-soft:#dbeafe;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cbd5e1;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px;color:#fff}
.logo-mark{width:42px;height:42px;border-radius:10px;display:block;flex:none}
.logo b{display:block;font-size:14px}.logo small{font-size:11px;color:#94a3b8}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;cursor:pointer;text-align:left;font-weight:600;width:100%}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.active{background:rgba(79,154,152,.22);color:#9fd6d3}
.aside-foot{margin-top:auto;font-size:11px;color:#64748b;padding:8px}
main{padding:24px 28px 120px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cbd5e1}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0d6660}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px}
.btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .value{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:1.4fr 1fr}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.mono{font-family:"JetBrains Mono",monospace}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f1f5f9;color:#475569;white-space:nowrap}
.tag.green{background:var(--ok-soft);color:var(--ok)}
.tag.amber{background:var(--warn-soft);color:var(--warn)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.teal{background:var(--brand-soft);color:var(--brand)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12.5px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.projects{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pcard{cursor:pointer;transition:transform .12s, box-shadow .12s;position:relative;overflow:hidden}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08)}
.pcard .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.progress{height:7px;border-radius:99px;background:#eef2f7;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--brand-2);border-radius:99px}
.progress.over span{background:#f59e0b}
.stats{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.stats div{font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--brand);border-color:var(--brand)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.table-wrap{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.kanban{grid-template-columns:repeat(3,1fr);align-items:start}
.col{background:#eef1f5;border-radius:12px;padding:10px}
.col-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;padding:4px 6px 10px;color:#475569}
.dcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;box-shadow:var(--shadow)}
.dcard .t{font-weight:700;margin-bottom:4px}
.dcard .d{font-size:12.5px;color:var(--muted);margin-bottom:8px;white-space:pre-wrap}
.dcard .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* timer */
.timerbar{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(15,52,54,.35);z-index:40;max-width:calc(100vw - 40px)}
.timerbar .clock{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;color:#9fd6d3}
.timerbar .info{font-size:12px;color:#cbd5e1;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timerbar .info b{color:#fff;display:block;font-size:13px}
.pulse{width:9px;height:9px;border-radius:50%;background:#f87171;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.btn.stop{background:#ef4444;border-color:#ef4444;color:#fff}
/* forms / modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:60;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin-bottom:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:#475569}
.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-2);outline-offset:0;border-color:transparent}
.field small{color:var(--muted);font-size:11.5px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.seg{display:inline-flex;background:#eef1f5;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;transition:transform .25s}
.toast.show{transform:translateX(-50%) translateY(0)}
/* invoice */
.invoice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:34px;max-width:820px;margin:0 auto;box-shadow:var(--shadow)}
.inv-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--brand);padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap}
.inv-head h2{font-size:22px;margin:0}
.inv-box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px}
.inv-total{display:flex;justify-content:flex-end;margin-top:14px}
.inv-total table{width:auto;min-width:320px}
.inv-total td{border:0;padding:5px 10px}
.inv-total tr.grand td{font-size:18px;font-weight:800;border-top:2px solid var(--ink);padding-top:10px}
.strike{text-decoration:line-through;color:var(--muted)}
.discount{color:var(--ok);font-weight:700}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--brand);font-weight:800;margin:22px 0 8px}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.toolbar .field{min-width:180px}
.demo-badge{font-size:11px;background:var(--warn-soft);color:var(--warn);padding:4px 10px;border-radius:99px;font-weight:700}
/* login + sync */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#0f3436,#13666a);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login.hide{display:none}
.login-box{background:#fff;border-radius:20px;padding:34px 30px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box img{width:100%;max-width:300px;margin:0 auto 18px;display:block}
.login-box p{color:var(--muted);margin:0 0 22px}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;font-size:15px}
.gbtn:hover{background:#f8fafc}
.gbtn svg{width:20px;height:20px}
#login-msg{color:var(--danger);font-size:13px;margin-top:14px;min-height:18px}
.lform{display:flex;flex-direction:column;gap:10px;text-align:left}
.lform input{border:1px solid #d1d5db;border-radius:10px;padding:12px 14px;font-size:16px;width:100%}
.lform input:focus{outline:2px solid var(--brand-2);border-color:transparent}
.btn.big{padding:12px;font-size:15px;justify-content:center;width:100%}
.links{margin-top:14px;font-size:13px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;align-items:center}
.lnk{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:4px;font-size:13px}
.pin-t{margin:0 0 14px!important}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:6px 0 18px}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand);display:block}
.pin-dots span.on{background:var(--brand)}
.pin-dots.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pin-pad button{height:60px;border-radius:50%;border:1px solid var(--line);background:#f8fafc;font-size:22px;font-weight:700;cursor:pointer;color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pin-pad button:active{background:var(--brand-soft)}
.login-box .pin-logo{width:64px;height:64px;margin:0 auto 10px;display:block;border-radius:14px}
.spin{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#sync{position:fixed;top:10px;right:14px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);z-index:45;box-shadow:var(--shadow)}
#sync.err{color:var(--danger);border-color:#fecaca}
.user-line{font-size:11px;color:#94a3b8;word-break:break-all;margin-bottom:6px}
.aside-foot .btn{background:transparent;color:#cbd5e1;border-color:#2c5557;width:100%;justify-content:center}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:50;justify-content:space-around;gap:0}
  .logo,.aside-foot{display:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;text-align:center}
  main{padding:16px 14px 150px}
  .kpis{grid-template-columns:1fr 1fr}
  .two,.kanban{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .timerbar{bottom:calc(78px + env(safe-area-inset-bottom));right:10px;left:10px;max-width:none}
  aside{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  main{padding-top:calc(16px + env(safe-area-inset-top))}
  input,select,textarea{font-size:16px!important}
  #sync{top:calc(8px + env(safe-area-inset-top))}
  .modal-bg{padding:20px 10px}
  .timerbar .info{max-width:none;flex:1}
  .invoice{padding:18px}
  .kpi .value{font-size:20px}
}
@media print{
  aside,.top,.toolbar,.timerbar,.no-print,#sync,.login{display:none!important}
  .app{display:block} main{padding:0} body{background:#fff}
  .invoice{border:0;box-shadow:none;padding:0}
}
</style>
</head>

async function flush(){

/* ================= Cálculo de cobrança ================= */
function calcular(p,lancs){
  const minutos=lancs.reduce((a,l)=>a+l.minutos,0);
  const horas=minutos/60;
  const visitasDias=[...new Set(lancs.filter(l=>l.modalidade==='presencial').map(l=>fdata(l.inicio)))];
  const visitas=visitasDias.length;
  const desloc=visitas*((+p.deslocIda||0)+(+p.deslocVolta||0));
  const linhas=[]; let servicos=0, descontoParceria=0;
  if(p.tipo==='hora'){
    const fr=+p.franquia||0;
    if(fr>0){
      const hPacote=p.pacoteMinimo?fr:Math.min(horas,fr);
      const hExc=Math.max(0,horas-fr);
      linhas.push({desc:p.pacoteMinimo?`Pacote mensal de ${fr}h (utilizadas ${hdec(Math.min(horas,fr)*60)}h)`:`Horas técnicas (até ${fr}h)`,qtd:hPacote,unit:+p.valorHora,total:hPacote*p.valorHora});
      if(hExc>0) linhas.push({desc:`Horas excedentes (acima de ${fr}h)`,qtd:hExc,unit:+p.valorExcedente,total:hExc*p.valorExcedente});
      servicos=hPacote*p.valorHora+hExc*p.valorExcedente;
    }else{
      linhas.push({desc:'Horas técnicas',qtd:horas,unit:+p.valorHora,total:horas*p.valorHora});
      servicos=horas*p.valorHora;
    }
    const hCobradas=linhas.reduce((a,l)=>a+l.qtd,0);
    if(+p.valorCheio>0) descontoParceria=Math.max(0,hCobradas*p.valorCheio-servicos);
  }else{
    linhas.push({desc:'Projeto em valor fechado',qtd:1,unit:+p.valorFechado,total:+p.valorFechado,fechado:true});
    servicos=+p.valorFechado;
  }
  if(visitas>0) linhas.push({desc:`Deslocamento — ${visitas} visita(s) presencial(is) (ida ${brl(+p.deslocIda)} + volta ${brl(+p.deslocVolta)})`,qtd:visitas,unit:(+p.deslocIda)+(+p.deslocVolta),total:desloc,desloc:true});
  return {minutos,horas,visitas,desloc,servicos,descontoParceria,total:servicos+desloc,linhas};
}

  const min=lm.reduce((a,l)=>a+l.minutos,0);
  let aFaturar=0;
  S.projetos.filter(p=>p.status==='ativo').forEach(p=>{const ls=lancsDe(p.id,mes).filter(l=>!l.faturado);if(ls.length||p.tipo==='hora'&&p.pacoteMinimo)aFaturar+=calcular(p,ls).total});
  const abertas=S.demandas.filter(d=>d.status!=='concluida').length;
  const visitas=new Set(lm.filter(l=>l.modalidade==='presencial').map(l=>l.projetoId+fdata(l.inicio))).size;
  const recentes=[...S.lancamentos].sort((a,b)=>b.inicio.localeCompare(a.inicio)).slice(0,6);
  const demAbertas=S.demandas.filter(d=>d.status!=='concluida').sort((a,b)=>({alta:0,media:1,baixa:2}[a.prioridade]-{alta:0,media:1,baixa:2}[b.prioridade])).slice(0,6);
  return `
  <div class="top"><div><h1>Painel</h1><div class="sub">${esc(mesNome(mes))} · visão geral dos seus serviços</div></div>
    <div class="row wrap"><button class="btn" onclick="telaCriarPin(true)">Trocar PIN</button><button class="btn" onclick="sair()">Sair</button><button class="btn primary" onclick="modalTimer()">${ICON.play} Iniciar cronômetro</button></div></div>
  <div class="grid kpis">
    <div class="card kpi"><div class="label">Horas no mês</div><div class="value">${hm(min)}</div><div class="hint">${lm.length} lançamentos</div></div>
    <div class="card kpi"><div class="label">A faturar (mês)</div><div class="value">${brl(aFaturar)}</div><div class="hint">projetos ativos, não faturado</div></div>
    <div class="card kpi"><div class="label">Demandas abertas</div><div class="value">${abertas}</div><div class="hint">a fazer + em andamento</div></div>
    <div class="card kpi"><div class="label">Visitas presenciais</div><div class="value">${visitas}</div><div class="hint">no mês</div></div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><div class="row between"><h2>Projetos ativos</h2><button class="btn sm" onclick="go('projetos')">Ver todos</button></div>
      <div class="list">${S.projetos.filter(p=>p.status==='ativo').map(p=>{
        const c=calcular(p,lancsDe(p.id,mes));const fr=+p.franquia;
        const pct=p.tipo==='hora'&&fr?Math.min(100,c.horas/fr*100):0;
        return `<div class="item" style="cursor:pointer" onclick="go('projeto',{id:'${p.id}'})"><span class="dot" style="background:${p.cor}"></span>
          <div class="grow"><div class="title">${esc(p.nome)}</div><div class="meta">${esc(p.cliente)} · ${hm(c.minutos)} no mês${p.tipo==='hora'&&fr?` de ${fr}h do pacote`:''}</div>
          ${p.tipo==='hora'&&fr?`<div class="progress ${c.horas>fr?'over':''}"><span style="width:${pct}%"></span></div>`:''}</div>
          <div class="mono" style="font-weight:700">${brl(c.total)}</div></div>`}).join('')||'<div class="empty">Nenhum projeto ativo</div>'}</div></div>
    <div class="card"><h2>Demandas prioritárias</h2><div class="list">${demAbertas.map(d=>`
      <div class="item"><div class="grow"><div class="title">${esc(d.titulo)}</div><div class="meta">${esc(proj(d.projetoId)?.nome||'')}</div></div>
      <span class="tag ${PRIOR[d.prioridade][1]}">${PRIOR[d.prioridade][0]}</span>
      <button class="btn icon sm" title="Cronometrar" onclick="iniciarTimer('${d.projetoId}','${d.id}')">${ICON.play}</button></div>`).join('')||'<div class="empty">Tudo em dia 🎉</div>'}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="row between"><h2>Últimos lançamentos de horas</h2><button class="btn sm" onclick="go('horas')">Ver todos</button></div>
    ${tabelaLanc(recentes,true)}</div>`;
}

  return `<div class="top"><div><h1>Projetos</h1><div class="sub">Cada projeto tem seu modelo de cobrança, demandas e horas</div></div>
    <button class="btn primary" onclick="modalProjeto()">${ICON.plus} Novo projeto</button></div>
  <div class="grid projects">${S.projetos.map(p=>{
    const c=calcular(p,lancsDe(p.id,mes));const ds=S.demandas.filter(d=>d.projetoId===p.id);
    const fr=+p.franquia;const pct=p.tipo==='hora'&&fr?Math.min(100,c.horas/fr*100):0;
    return `<div class="card pcard" onclick="go('projeto',{id:'${p.id}'})"><div class="bar" style="background:${p.cor}"></div>
      <div class="row between"><span class="tag ${p.tipo==='hora'?'teal':'blue'}">${p.tipo==='hora'?'Por hora':'Valor fechado'}</span>
      <span class="tag ${p.status==='ativo'?'green':''}">${p.status==='ativo'?'Ativo':p.status==='pausado'?'Pausado':'Encerrado'}</span></div>
      <h3 style="margin-top:10px;font-size:15px">${esc(p.nome)}</h3><div class="sub">${esc(p.cliente)}</div>
      ${p.tipo==='hora'&&fr?`<div class="progress ${c.horas>fr?'over':''}"><span style="width:${pct}%"></span></div><div class="meta muted" style="font-size:12px;margin-top:4px">${hm(c.minutos)} de ${fr}h do pacote este mês</div>`:''}
      <div class="stats"><div><b>${p.tipo==='hora'?brl(+p.valorHora)+'/h':brl(+p.valorFechado)}</b>${p.tipo==='hora'?'valor hora':'valor do projeto'}</div>
      <div><b>${ds.filter(d=>d.status!=='concluida').length}/${ds.length}</b>demandas abertas</div><div><b>${brl(c.total)}</b>no mês</div></div></div>`}).join('')||'<div class="card empty">Crie seu primeiro projeto</div>'}</div>`;
}

function vProjeto(){
  const p=proj(ctx.id); if(!p){view='projetos';return vProjetos()}
  const tab=ctx.tab||'demandas'; const mes=mesAtual();
  const c=calcular(p,lancsDe(p.id,mes)); const ds=S.demandas.filter(d=>d.projetoId===p.id);
  const total=lancsDe(p.id).reduce((a,l)=>a+l.minutos,0);
  let body='';
  if(tab==='demandas'){
    body=`<div class="row between" style="margin-bottom:12px"><div class="muted">${ds.length} demanda(s)</div><button class="btn primary sm" onclick="modalDemanda('${p.id}')">${ICON.plus} Nova demanda</button></div>
    <div class="grid kanban">${['aberta','andamento','concluida'].map(st=>{const it=ds.filter(d=>d.status===st);
      return `<div class="col"><div class="col-head">${STATUS_D[st][0]}<span class="tag">${it.length}</span></div>${it.map(d=>{
        const mins=S.lancamentos.filter(l=>l.demandaId===d.id).reduce((a,l)=>a+l.minutos,0);
        return `<div class="dcard"><div class="row between" style="align-items:flex-start"><div class="t">${esc(d.titulo)}</div><span class="tag ${PRIOR[d.prioridade][1]}">${PRIOR[d.prioridade][0]}</span></div>
        ${d.descricao?`<div class="d">${esc(d.descricao)}</div>`:''}
        <div class="meta muted" style="font-size:12px">${d.solicitante?esc(d.solicitante)+' · ':''}${fdata(d.criadaEm)} · <b>${hm(mins)}</b></div>
        <div class="actions">
          ${st!=='concluida'?`<button class="btn sm" onclick="iniciarTimer('${p.id}','${d.id}')">${ICON.play} Cronometrar</button>`:''}
          ${st==='aberta'?`<button class="btn sm" onclick="moverDem('${d.id}','andamento')">Iniciar →</button>`:''}
          ${st==='andamento'?`<button class="btn sm" onclick="moverDem('${d.id}','concluida')">Concluir ✓</button>`:''}
          ${st==='concluida'?`<button class="btn sm" onclick="moverDem('${d.id}','andamento')">Reabrir</button>`:''}
          <button class="btn sm icon" title="Editar" onclick="modalDemanda('${p.id}','${d.id}')">${ICON.edit}</button>
        </div></div>`}).join('')||'<div class="muted" style="font-size:12.5px;padding:6px">Nada aqui</div>'}</div>`}).join('')}</div>`;
  }else if(tab==='horas'){
    const ls=lancsDe(p.id).reverse();
    body=`<div class="row between" style="margin-bottom:12px"><div class="muted">Total geral: <b>${hm(total)}</b></div>
      <div class="row"><button class="btn sm" onclick="modalLanc(null,'${p.id}')">${ICON.plus} Lançar manual</button><button class="btn primary sm" onclick="iniciarTimer('${p.id}','')">${ICON.play} Cronometrar</button></div></div>
      <div class="card" style="padding:6px 12px">${tabelaLanc(ls,false)}</div>`;
  }else{
    body=`<div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      ${p.tipo==='hora'?`
      <div><div class="muted">Valor hora cheio (referência)</div><b style="font-size:17px">${brl(+p.valorCheio)}</b></div>
      <div><div class="muted">Valor hora praticado</div><b style="font-size:17px">${brl(+p.valorHora)}</b></div>
      <div><div class="muted">Pacote mensal</div><b style="font-size:17px">${+p.franquia?p.franquia+'h'+(p.pacoteMinimo?' (mínimo garantido)':''):'Sem pacote'}</b></div>
      <div><div class="muted">Hora excedente</div><b style="font-size:17px">${brl(+p.valorExcedente)}</b></div>`:
      `<div><div class="muted">Valor fechado</div><b style="font-size:17px">${brl(+p.valorFechado)}</b></div>`}
      <div><div class="muted">Deslocamento por visita</div><b style="font-size:17px">${brl((+p.deslocIda)+(+p.deslocVolta))}</b> <span class="muted">(ida ${brl(+p.deslocIda)} + volta ${brl(+p.deslocVolta)})</span></div>

  }

    <div class="row"><button class="btn" onclick="modalProjeto('${p.id}')">${ICON.edit} Editar</button><button class="btn primary" onclick="go('cobranca',{pid:'${p.id}'})">Gerar cobrança</button></div></div>
  <div class="grid kpis">
    <div class="card kpi"><div class="label">Horas no mês</div><div class="value">${hm(c.minutos)}</div><div class="hint">${p.tipo==='hora'&&+p.franquia?`pacote: ${p.franquia}h`:'informativo'}</div></div>
    <div class="card kpi"><div class="label">Valor do mês</div><div class="value">${brl(c.total)}</div><div class="hint">serviços + deslocamento</div></div>
    <div class="card kpi"><div class="label">Visitas no mês</div><div class="value">${c.visitas}</div><div class="hint">${brl(c.desloc)} de deslocamento</div></div>
    <div class="card kpi"><div class="label">Demandas</div><div class="value">${ds.filter(d=>d.status!=='concluida').length}<span class="muted" style="font-size:15px">/${ds.length}</span></div><div class="hint">abertas / total</div></div>

  ${body}`;
}

function tabelaLanc(ls,mostrarProj){
  if(!ls.length)return '<div class="empty">Nenhum lançamento ainda</div>';
  return `<div class="table-wrap"><table><thead><tr><th>Data</th>${mostrarProj?'<th>Projeto</th>':''}<th>Demanda / atividade</th><th>Local</th><th class="num">Tempo</th><th></th></tr></thead><tbody>
  ${ls.map(l=>{const p=proj(l.projetoId),d=dem(l.demandaId);return `<tr>
    <td style="white-space:nowrap">${fdata(l.inicio)}<div class="muted" style="font-size:12px">${fhora(l.inicio)}</div></td>
    ${mostrarProj?`<td><span class="dot" style="display:inline-block;background:${p?.cor||'#999'};margin-right:6px"></span>${esc(p?.nome||'—')}</td>`:''}
    <td><b>${esc(d?.titulo||'Geral')}</b><div class="muted" style="font-size:12.5px">${esc(l.descricao||'')}</div>${l.usuario?`<div class="muted" style="font-size:11.5px">por ${esc(l.usuario)}</div>`:''}</td>
    <td><span class="tag ${l.modalidade==='presencial'?'amber':'blue'}">${l.modalidade==='presencial'?'Presencial':'Remoto'}</span>${l.faturado?' <span class="tag green">Faturado</span>':''}</td>
    <td class="num mono" style="font-weight:700">${hm(l.minutos)}</td>
    <td class="num"><button class="btn icon sm" onclick="modalLanc('${l.id}')">${ICON.edit}</button></td></tr>`}).join('')}</tbody></table></div>`;
}

function vHoras(){
  const f=ctx.f||{pid:'',mes:mesAtual()};
  let ls=S.lancamentos.filter(l=>(!f.pid||l.projetoId===f.pid)&&(!f.mes||mesKey(l.inicio)===f.mes)).sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const tot=ls.reduce((a,l)=>a+l.minutos,0);
  return `<div class="top"><div><h1>Horas</h1><div class="sub">Todos os lançamentos, cronometrados ou manuais</div></div>
    <div class="row"><button class="btn" onclick="modalLanc()">${ICON.plus} Lançar manual</button><button class="btn primary" onclick="modalTimer()">${ICON.play} Cronometrar</button></div></div>
  <div class="toolbar">
    <div class="field"><label>Projeto</label><select onchange="go('horas',{f:{...(ctx.f||{mes:mesAtual()}),pid:this.value}})"><option value="">Todos</option>${S.projetos.map(p=>`<option value="${p.id}" ${f.pid===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Mês</label><select onchange="go('horas',{f:{...(ctx.f||{pid:''}),mes:this.value}})">${opcoesMes(f.mes,true)}</select></div>
    <div class="card" style="padding:10px 16px"><span class="muted">Total filtrado:</span> <b class="mono">${hm(tot)}</b> <span class="muted">(${hdec(tot)}h)</span></div>
  </div>
  <div class="card" style="padding:6px 12px">${tabelaLanc(ls,true)}</div>`;
}
function opcoesMes(sel,todos){
  const set=new Set(S.lancamentos.map(l=>mesKey(l.inicio)));set.add(mesAtual());
  return (todos?`<option value="" ${!sel?'selected':''}>Todos</option>`:'')+[...set].sort().reverse().map(k=>`<option value="${k}" ${k===sel?'selected':''}>${mesNome(k)}</option>`).join('');
}

function vCobranca(){

  const ls=lancsDe(p.id,mes).filter(l=>incluirFat||!l.faturado);

  const num=`${mes.replace('-','')}-${String(S.projetos.indexOf(p)+1).padStart(2,'0')}`;
  const venc=new Date();venc.setDate(venc.getDate()+10);
  const porDem={};ls.forEach(l=>{const k=l.demandaId||'_';porDem[k]=(porDem[k]||0)+l.minutos});

    <div class="field"><label>Competência</label><select onchange="go('cobranca',{pid:'${p.id}',mes:this.value})">${opcoesMes(mes,false)}</select></div>
    <label class="row" style="padding-bottom:10px;font-weight:600;font-size:13px"><input type="checkbox" ${incluirFat?'checked':''} onchange="go('cobranca',{pid:'${p.id}',mes:'${mes}',fat:this.checked})"> Incluir já faturados</label>

      <b>${esc(S.perfil.nome)}</b><div class="muted" style="font-size:12.5px">${esc(S.perfil.doc)}${S.perfil.email?' · '+esc(S.perfil.email):''}</div></div>
      <div style="text-align:right"><h2>Demonstrativo de Serviços</h2><div class="muted">Nº <b class="mono" style="color:var(--ink)">${num}</b></div>
      <div class="muted">Competência: <b style="color:var(--ink)">${esc(mesNome(mes))}</b></div><div class="muted">Emissão: ${new Date().toLocaleDateString('pt-BR')} · Vencimento: ${venc.toLocaleDateString('pt-BR')}</div></div></div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="inv-box"><div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase">Cliente</div><b>${esc(p.cliente)}</b><div>${esc(p.contato||'')}</div></div>
      <div class="inv-box"><div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase">Projeto</div><b>${esc(p.nome)}</b><div>${p.tipo==='hora'?'Cobrança por hora técnica':'Valor fechado'} · ${hm(c.minutos)} trabalhadas</div></div>
    </div>
    <div class="sec-title">Resumo da cobrança</div>
    <div class="table-wrap"><table><thead><tr><th>Descrição</th><th class="num">Qtd.</th><th class="num">Valor unit.</th><th class="num">Total</th></tr></thead><tbody>
      ${c.linhas.map(l=>`<tr><td>${esc(l.desc)}</td><td class="num">${l.fechado?'1':l.desloc?l.qtd:hdec(l.qtd*60)+'h'}</td><td class="num">${brl(l.unit)}</td><td class="num"><b>${brl(l.total)}</b></td></tr>`).join('')}

      <tr><td class="discount">Desconto parceria — primeiro projeto</td><td class="num discount">− ${brl(c.descontoParceria)}</td></tr>`:''}
      <tr><td>Serviços</td><td class="num">${brl(c.servicos)}</td></tr>
      ${c.desloc?`<tr><td>Deslocamentos</td><td class="num">${brl(c.desloc)}</td></tr>`:''}

    ${p.tipo==='hora'?`<div class="sec-title">Horas por demanda</div><div class="table-wrap"><table><tbody>${Object.entries(porDem).map(([k,m])=>`<tr><td>${esc(dem(k)?.titulo||'Atividades gerais')}</td><td class="num mono">${hm(m)}</td></tr>`).join('')||'<tr><td class="muted">Sem horas no período</td></tr>'}</tbody></table></div>`:''}

    <div class="table-wrap"><table><thead><tr><th>Data</th><th>Demanda / atividade</th><th>Local</th><th class="num">Tempo</th></tr></thead><tbody>
      ${ls.map(l=>`<tr><td style="white-space:nowrap">${fdata(l.inicio)}</td><td><b>${esc(dem(l.demandaId)?.titulo||'Geral')}</b>${l.descricao?`<div class="muted" style="font-size:12px">${esc(l.descricao)}</div>`:''}</td><td>${l.modalidade==='presencial'?'Presencial':'Remoto'}</td><td class="num mono">${hm(l.minutos)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sem lançamentos no período</td></tr>'}

  </div>`;
}

    <td><span class="tag ${u.papel==='admin'?'teal':''}">${u.papel==='admin'?'Administrador':'Membro'}</span></td>
    <td>${u.ativo===false?'<span class="tag red">Bloqueado</span>':'<span class="tag green">Ativo</span>'}</td>
    <td class="muted" style="white-space:nowrap">${u.ultimoAcesso?fdata(u.ultimoAcesso):'Ainda não entrou'}</td>
    <td class="num">${u.email===DONO?'':`<button class="btn icon sm" title="Editar" onclick="modalUsuario('${esc(u.email)}')">${ICON.edit}</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum usuário</td></tr>'}
  </tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h2>Como dar acesso a alguém</h2>
    <ol class="muted" style="margin:0;padding-left:18px;line-height:1.9">
      <li>Clique em <b>Novo usuário</b> e cadastre o nome e o e-mail da pessoa.</li>
      <li>Envie para ela o link do painel: <b style="word-break:break-all">${esc(APP_URL)}</b></li>
      <li>Ela clica em <b>Primeiro acesso</b>, recebe um e-mail para criar a senha, entra e cria o PIN de ${PIN_LEN} números.</li>
      <li>Para tirar o acesso, edite o usuário e marque <b>Bloqueado</b>.</li>
    </ol></div>`;
}
function modalUsuario(email){
  const u=email?S.usuarios.find(x=>x.email===email):{nome:'',email:'',papel:'membro',ativo:true};
  openModal(`<h2>${email?'Editar usuário':'Novo usuário'}</h2><div class="fields">
    <div class="field full"><label>Nome</label><input id="u-n" value="${esc(u.nome||'')}" placeholder="Ex.: Maria Souza"></div>
    <div class="field full"><label>E-mail</label><input id="u-e" type="email" value="${esc(u.email)}" ${email?'disabled':''} placeholder="email@empresa.com.br"><small>É com este e-mail que a pessoa faz o primeiro acesso.</small></div>
    <div class="field"><label>Perfil</label><select id="u-p"><option value="membro" ${u.papel!=='admin'?'selected':''}>Membro</option><option value="admin" ${u.papel==='admin'?'selected':''}>Administrador</option></select><small>Administrador também gerencia a equipe.</small></div>
    <div class="field"><label>Situação</label><select id="u-a"><option value="1" ${u.ativo!==false?'selected':''}>Ativo</option><option value="0" ${u.ativo===false?'selected':''}>Bloqueado</option></select></div>
  </div><div class="modal-foot">${email?`<button class="btn danger" style="margin-right:auto" onclick="excluirUsuario('${esc(email)}')">${ICON.trash} Remover</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="u-s">Salvar</button></div>`);
  $('#u-s').onclick=async()=>{
    const em=(email||$('#u-e').value).trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Informe um e-mail válido');return}
    if(!email&&S.usuarios.some(x=>x.email===em)){toast('Este e-mail já está cadastrado');return}
    const dados={nome:$('#u-n').value.trim(),papel:$('#u-p').value,ativo:$('#u-a').value==='1'};
    if(!email)dados.criadoEm=new Date().toISOString();
    try{await db.collection('usuarios').doc(em).set(dados,{merge:true});
      const ex=S.usuarios.find(x=>x.email===em);if(ex)Object.assign(ex,dados);else S.usuarios.push({email:em,...dados});
      closeModal();render();toast(email?'Usuário atualizado':'Usuário cadastrado — envie o link do painel para a pessoa')}
    catch(e){toast('Erro ao salvar: '+(e.code||e.message))}
  };
}
function excluirUsuario(email){confirmar(`Remover ${email} da equipe? A pessoa perde o acesso ao painel.`,async()=>{
  try{await db.collection('usuarios').doc(email).delete();S.usuarios=S.usuarios.filter(x=>x.email!==email);render();toast('Usuário removido')}
  catch(e){toast('Erro: '+(e.code||e.message))}
})}

/* ================= Ações ================= */
function moverDem(id,st){const d=dem(id);d.status=st;save();render();toast('Demanda atualizada')}
function marcarFaturado(pid,mes){
  const ls=lancsDe(pid,mes).filter(l=>!l.faturado);
  if(!ls.length){toast('Nada pendente nesta competência');return}
  confirmar(`Marcar ${ls.length} lançamento(s) de ${mesNome(mes)} como faturados?`,()=>{ls.forEach(l=>l.faturado=true);save();render();toast('Cobrança marcada como faturada')});
}
function textoCobranca(){return $('#invoice').innerText.replace(/\n{3,}/g,'\n\n')}
async function copiarCobranca(){try{await navigator.clipboard.writeText(textoCobranca());toast('Demonstrativo copiado')}catch(e){toast('Não foi possível copiar aqui')}}
function imprimir(){window.print()}

/* ================= Cronômetro ================= */
function iniciarTimer(pid,did,mod,desc){
  if(S.timer){toast('Já existe um cronômetro rodando');return}
  S.timer={projetoId:pid,demandaId:did||'',inicio:new Date().toISOString(),modalidade:mod||'remoto',descricao:desc||''};
  const d=dem(did); if(d&&d.status==='aberta')d.status='andamento';
  save();render();toast('Cronômetro iniciado');
}
function renderTimer(){
  const el=$('#timerbar');clearInterval(tick);
  if(!S.timer){el.style.display='none';return}
  const t=S.timer,p=proj(t.projetoId),d=dem(t.demandaId);
  el.style.display='flex';
  el.innerHTML=`<span class="pulse"></span><div class="clock" id="clock">00:00:00</div>
   <div class="info"><b>${esc(d?.titulo||'Atividade geral')}</b>${esc(p?.nome||'')} · <a href="#" style="color:#9fd6d3" onclick="event.preventDefault();toggleMod()">${t.modalidade==='presencial'?'Presencial':'Remoto'}</a></div>
   <button class="btn sm stop" onclick="pararTimer()">■ Parar</button>`;
  const up=()=>{const s=Math.floor((Date.now()-new Date(t.inicio))/1000);const c=$('#clock');if(c)c.textContent=[s/3600,s%3600/60,s%60].map(v=>String(Math.floor(v)).padStart(2,'0')).join(':')};
  up();tick=setInterval(up,1000);
}
function toggleMod(){S.timer.modalidade=S.timer.modalidade==='presencial'?'remoto':'presencial';save();renderTimer()}
function pararTimer(){
  const t=S.timer;const min=Math.max(1,Math.round((Date.now()-new Date(t.inicio))/60000));
  openModal(`<h2>Finalizar cronômetro</h2>
   <div class="fields">
    <div class="field"><label>Tempo registrado (minutos)</label><input id="f-min" type="number" min="1" value="${min}"><small>${hm(min)} — ajuste se precisar</small></div>
    <div class="field"><label>Local</label><select id="f-mod"><option value="remoto" ${t.modalidade==='remoto'?'selected':''}>Remoto</option><option value="presencial" ${t.modalidade==='presencial'?'selected':''}>Presencial (gera deslocamento)</option></select></div>
    <div class="field full"><label>O que foi feito</label><textarea id="f-desc" rows="3" placeholder="Ex.: ajustes na tela de aprovação">${esc(t.descricao)}</textarea></div>
   </div>
   <div class="modal-foot"><button class="btn danger" onclick="descartarTimer()">Descartar</button><button class="btn" onclick="closeModal()">Continuar contando</button><button class="btn primary" onclick="salvarTimer()">Salvar horas</button></div>`);
}
function salvarTimer(){
  const t=S.timer;
  S.lancamentos.push({id:uid(),projetoId:t.projetoId,demandaId:t.demandaId,inicio:t.inicio,minutos:Math.max(1,+$('#f-min').value||1),modalidade:$('#f-mod').value,descricao:$('#f-desc').value.trim(),faturado:false,usuario:EU.nome||EU.email,usuarioEmail:EU.email});
  S.timer=null;save();closeModal();render();toast('Horas lançadas');
}
function descartarTimer(){confirmar('Descartar este tempo sem salvar?',()=>{S.timer=null;save();render()})}
function modalTimer(){
  if(S.timer){toast('Já existe um cronômetro rodando');return}
  if(!S.projetos.length){toast('Crie um projeto primeiro');return}
  openModal(`<h2>Iniciar cronômetro</h2><div class="fields">
    <div class="field full"><label>Projeto</label><select id="t-p" onchange="fillDem('t-d',this.value)">${S.projetos.filter(p=>p.status!=='encerrado').map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
    <div class="field full"><label>Demanda</label><select id="t-d"></select></div>
    <div class="field"><label>Local</label><select id="t-m"><option value="remoto">Remoto</option><option value="presencial">Presencial</option></select></div>
    <div class="field"><label>Descrição (opcional)</label><input id="t-desc"></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="const p=$('#t-p').value,d=$('#t-d').value,m=$('#t-m').value,ds=$('#t-desc').value;closeModal();iniciarTimer(p,d,m,ds)">${ICON.play} Iniciar</button></div>`);
  fillDem('t-d',$('#t-p').value);
}
function fillDem(selId,pid,sel){
  $('#'+selId).innerHTML='<option value="">— Atividade geral —</option>'+S.demandas.filter(d=>d.projetoId===pid&&(d.status!=='concluida'||d.id===sel)).map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${esc(d.titulo)}</option>`).join('');
}

/* ================= Modais de cadastro ================= */
function openModal(h){$('#modal').innerHTML=h;$('#modalbg').classList.add('open')}
function closeModal(){$('#modalbg').classList.remove('open')}
$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});
function confirmar(msg,ok){openModal(`<h2>Confirmar</h2><p>${esc(msg)}</p><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="cf-ok">Confirmar</button></div>`);$('#cf-ok').onclick=()=>{closeModal();ok()}}

function modalProjeto(id){
  const p=id?proj(id):{nome:'',cliente:'',contato:'',tipo:'hora',valorCheio:250,valorHora:180,franquia:20,valorExcedente:150,pacoteMinimo:true,valorFechado:0,deslocIda:60,deslocVolta:60,status:'ativo',cor:CORES[S.projetos.length%CORES.length]};
  openModal(`<h2>${id?'Editar projeto':'Novo projeto'}</h2><div class="fields">
   <div class="field full"><label>Nome do projeto</label><input id="p-nome" value="${esc(p.nome)}" placeholder="Ex.: Micro sistemas financeiros"></div>
   <div class="field"><label>Cliente</label><input id="p-cli" value="${esc(p.cliente)}"></div>
   <div class="field"><label>Contato / responsável</label><input id="p-cont" value="${esc(p.contato)}"></div>
   <div class="field full"><label>Modelo de cobrança</label><div class="seg" id="p-tipo">${[['hora','Por hora'],['fechado','Valor fechado']].map(([k,l])=>`<button type="button" data-v="${k}" class="${p.tipo===k?'on':''}">${l}</button>`).join('')}</div></div>
   <div id="p-hora" class="field full" style="display:${p.tipo==='hora'?'grid':'none'};grid-template-columns:1fr 1fr;gap:12px">
     <div class="field"><label>Hora cheia (referência)</label><input id="p-cheio" type="number" step="0.01" value="${p.valorCheio}"><small>Aparece riscada com o desconto de parceria</small></div>
     <div class="field"><label>Hora praticada</label><input id="p-vh" type="number" step="0.01" value="${p.valorHora}"></div>
     <div class="field"><label>Pacote mensal (horas)</label><input id="p-fr" type="number" value="${p.franquia}"><small>0 = sem pacote</small></div>
     <div class="field"><label>Hora excedente</label><input id="p-exc" type="number" step="0.01" value="${p.valorExcedente}"></div>
     <label class="field full row" style="flex-direction:row;font-weight:600;font-size:13px"><input type="checkbox" id="p-min" style="width:auto" ${p.pacoteMinimo?'checked':''}> Pacote é mínimo garantido (cobra mesmo se usar menos)</label>
   </div>
   <div id="p-fech" class="field full" style="display:${p.tipo==='fechado'?'flex':'none'}"><label>Valor fechado do projeto</label><input id="p-vf" type="number" step="0.01" value="${p.valorFechado}"></div>
   <div class="field"><label>Deslocamento — ida</label><input id="p-di" type="number" step="0.01" value="${p.deslocIda}"></div>
   <div class="field"><label>Deslocamento — volta</label><input id="p-dv" type="number" step="0.01" value="${p.deslocVolta}"></div>
   <div class="field"><label>Status</label><select id="p-st">${[['ativo','Ativo'],['pausado','Pausado'],['encerrado','Encerrado']].map(([k,l])=>`<option value="${k}" ${p.status===k?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="field"><label>Cor</label><div class="row">${CORES.map(c=>`<button type="button" class="cor-b" data-c="${c}" style="width:26px;height:26px;border-radius:50%;border:3px solid ${c===p.cor?'#14213d':'#fff'};background:${c};cursor:pointer;box-shadow:0 0 0 1px #ddd"></button>`).join('')}</div></div>
  </div><div class="modal-foot">${id?`<button class="btn danger" style="margin-right:auto" onclick="excluirProjeto('${id}')">${ICON.trash} Excluir</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="p-save">Salvar</button></div>`);
  let tipo=p.tipo,cor=p.cor;
  document.querySelectorAll('#p-tipo button').forEach(b=>b.onclick=()=>{tipo=b.dataset.v;document.querySelectorAll('#p-tipo button').forEach(x=>x.classList.toggle('on',x===b));$('#p-hora').style.display=tipo==='hora'?'grid':'none';$('#p-fech').style.display=tipo==='fechado'?'flex':'none'});
  document.querySelectorAll('.cor-b').forEach(b=>b.onclick=()=>{cor=b.dataset.c;document.querySelectorAll('.cor-b').forEach(x=>x.style.borderColor=x===b?'#14213d':'#fff')});
  $('#p-save').onclick=()=>{
    const nome=$('#p-nome').value.trim();if(!nome){toast('Informe o nome do projeto');return}
    const dados={nome,cliente:$('#p-cli').value.trim(),contato:$('#p-cont').value.trim(),tipo,valorCheio:+$('#p-cheio').value||0,valorHora:+$('#p-vh').value||0,franquia:+$('#p-fr').value||0,valorExcedente:+$('#p-exc').value||0,pacoteMinimo:$('#p-min').checked,valorFechado:+$('#p-vf').value||0,deslocIda:+$('#p-di').value||0,deslocVolta:+$('#p-dv').value||0,status:$('#p-st').value,cor};
    if(id)Object.assign(proj(id),dados);else{const n={id:uid(),inicio:new Date().toISOString(),...dados};S.projetos.push(n);ctx={id:n.id};view='projeto'}
    save();closeModal();render();toast('Projeto salvo');
  };
}
function excluirProjeto(id){confirmar('Excluir o projeto com todas as demandas e horas?',()=>{S.projetos=S.projetos.filter(p=>p.id!==id);S.demandas=S.demandas.filter(d=>d.projetoId!==id);S.lancamentos=S.lancamentos.filter(l=>l.projetoId!==id);if(S.timer?.projetoId===id)S.timer=null;save();go('projetos');toast('Projeto excluído')})}

function modalDemanda(pid,id){
  const d=id?dem(id):{titulo:'',descricao:'',solicitante:'',prioridade:'media',status:'aberta'};
  openModal(`<h2>${id?'Editar demanda':'Nova demanda'}</h2><div class="fields">
   <div class="field full"><label>Título</label><input id="d-t" value="${esc(d.titulo)}" placeholder="Ex.: Relatório de fluxo de caixa"></div>
   <div class="field full"><label>Descrição / requisitos</label><textarea id="d-d" rows="4">${esc(d.descricao)}</textarea></div>
   <div class="field"><label>Solicitante</label><input id="d-s" value="${esc(d.solicitante)}" placeholder="Setor ou pessoa"></div>
   <div class="field"><label>Prioridade</label><select id="d-p">${Object.entries(PRIOR).map(([k,[l]])=>`<option value="${k}" ${d.prioridade===k?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="field"><label>Status</label><select id="d-st">${Object.entries(STATUS_D).map(([k,[l]])=>`<option value="${k}" ${d.status===k?'selected':''}>${l}</option>`).join('')}</select></div>
  </div><div class="modal-foot">${id?`<button class="btn danger" style="margin-right:auto" onclick="excluirDem('${id}')">${ICON.trash} Excluir</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="d-save">Salvar</button></div>`);
  $('#d-save').onclick=()=>{
    const titulo=$('#d-t').value.trim();if(!titulo){toast('Informe o título');return}
    const dados={titulo,descricao:$('#d-d').value.trim(),solicitante:$('#d-s').value.trim(),prioridade:$('#d-p').value,status:$('#d-st').value};
    if(id)Object.assign(dem(id),dados);else S.demandas.push({id:uid(),projetoId:pid,criadaEm:new Date().toISOString(),...dados});
    save();closeModal();render();toast('Demanda salva');
  };
}
function excluirDem(id){confirmar('Excluir esta demanda? As horas lançadas nela ficam como "Geral".',()=>{S.demandas=S.demandas.filter(d=>d.id!==id);S.lancamentos.forEach(l=>{if(l.demandaId===id)l.demandaId=''});save();render()})}

function modalLanc(id,pidPadrao){
  const l=id?S.lancamentos.find(x=>x.id===id):{projetoId:pidPadrao||S.projetos[0]?.id,demandaId:'',inicio:new Date().toISOString(),minutos:60,modalidade:'remoto',descricao:''};
  if(!l.projetoId){toast('Crie um projeto primeiro');return}
  const dt=new Date(l.inicio);const loc=new Date(dt-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);
  openModal(`<h2>${id?'Editar lançamento':'Lançar horas manualmente'}</h2><div class="fields">
   <div class="field full"><label>Projeto</label><select id="l-p" onchange="fillDem('l-d',this.value)">${S.projetos.map(p=>`<option value="${p.id}" ${p.id===l.projetoId?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
   <div class="field full"><label>Demanda</label><select id="l-d"></select></div>
   <div class="field"><label>Data e hora de início</label><input id="l-i" type="datetime-local" value="${loc}"></div>
   <div class="field"><label>Duração</label><div class="row"><input id="l-h" type="number" min="0" value="${Math.floor(l.minutos/60)}" style="width:70px"> h <input id="l-m" type="number" min="0" max="59" value="${l.minutos%60}" style="width:70px"> min</div></div>
   <div class="field"><label>Local</label><select id="l-mod"><option value="remoto" ${l.modalidade==='remoto'?'selected':''}>Remoto</option><option value="presencial" ${l.modalidade==='presencial'?'selected':''}>Presencial</option></select></div>
   <div class="field"><label>Faturado</label><select id="l-f"><option value="0">Não</option><option value="1" ${l.faturado?'selected':''}>Sim</option></select></div>
   <div class="field full"><label>Descrição</label><textarea id="l-desc" rows="2">${esc(l.descricao)}</textarea></div>
  </div><div class="modal-foot">${id?`<button class="btn danger" style="margin-right:auto" onclick="excluirLanc('${id}')">${ICON.trash} Excluir</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="l-save">Salvar</button></div>`);
  fillDem('l-d',l.projetoId,l.demandaId);
  $('#l-save').onclick=()=>{
    const min=(+$('#l-h').value||0)*60+(+$('#l-m').value||0);if(min<=0){toast('Informe a duração');return}
    const dados={projetoId:$('#l-p').value,demandaId:$('#l-d').value,inicio:new Date($('#l-i').value).toISOString(),minutos:min,modalidade:$('#l-mod').value,faturado:$('#l-f').value==='1',descricao:$('#l-desc').value.trim()};
    if(id)Object.assign(l,dados);else S.lancamentos.push({id:uid(),...dados,usuario:EU.nome||EU.email,usuarioEmail:EU.email});
    save();closeModal();render();toast('Lançamento salvo');
  };
}
function modalPerfil(){
  const f=S.perfil;
  openModal(`<h2>Meus dados (emitente)</h2><div class="fields">
   <div class="field full"><label>Nome / razão social</label><input id="pf-n" value="${esc(f.nome)}"></div>
   <div class="field"><label>Documento</label><input id="pf-d" value="${esc(f.doc)}"></div>
   <div class="field"><label>E-mail / telefone</label><input id="pf-e" value="${esc(f.email)}"></div>
   <div class="field full"><label>Forma de pagamento</label><input id="pf-p" value="${esc(f.pix)}"></div>
  </div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="pf-s">Salvar</button></div>`);
  $('#pf-s').onclick=()=>{S.perfil={nome:$('#pf-n').value.trim(),doc:$('#pf-d').value.trim(),email:$('#pf-e').value.trim(),pix:$('#pf-p').value.trim()};save();closeModal();render();toast('Dados atualizados')};
}
function excluirLanc(id){confirmar('Excluir este lançamento de horas?',()=>{S.lancamentos=S.lancamentos.filter(l=>l.id!==id);save();render()})}

</script>
</body>
</html>
